<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub - Criar Conta</title>
  <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>
  <div class="site">
    <aside class="menu-lateral">
      <div class="marca">
        <a href="index.html">EventHub</a>
        <span>Eventos e iniciativas</span>
      </div>
      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Galeria</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="perfil.html">Conta</a>
      </nav>
      <div class="menu-rodape">© 2026 EventHub</div>
    </aside>
    
    <div class="area-principal">
      <header class="topo">
        <a href="index.html" class="logo">Event<span>Hub</span></a>
        <a href="publicar.html" class="btn-destaque">Publicar</a>
      </header>
      
      <main>
        <div class="form-area">
          <div class="form-box">
            <h2>Criar Conta</h2>
            <form action="login.html" method="get">
              <input type="email" name="email" placeholder="E-mail" required>
              <input type="text" name="usuario" placeholder="Nome de Usuario" required>
              <input type="password" name="senha" placeholder="Senha" required>
              <input type="password" name="confirmar" placeholder="Confirmar Senha" required>
              <button type="submit">Registrar</button>
            </form>
            <p class="link-login">Já tem uma conta? <a href="login.html">Fazer login</a></p>
          </div>
        </div>
      </main>
      <footer class="rodape">
        <a href="contato.html">Fale Conosco</a>
        <span>2026</span>
        <span>Redes Sociais</span>
      </footer>
    </div>
  </div>
</body>
</html>
