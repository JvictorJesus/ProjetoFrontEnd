<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub - Galeria</title>
  <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>
  <div class="site">
    <aside class="menu-lateral">
      <div class="marca">
        <a href="index.html">EventHub</a>
        <span>Eventos e iniciativas</span>
      </div>
      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html" class="ativo">Galeria</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="perfil.html">Conta</a>
      </nav>
      <div class="menu-rodape">© 2026 EventHub</div>
    </aside>
    
    <div class="area-principal">
      <header class="topo">
        <a href="index.html" class="logo">Event<span>Hub</span></a>

        <!-- Barra de pesquisa no centro -->
        <div class="topo-pesquisa">
          <input type="text" placeholder="Pesquisar eventos ou projetos...">
        </div>

        <a href="publicar.html" class="btn-destaque">Publicar</a>
      </header>

      <main>
        <div class="galeria-container">
          <div class="galeria-header">
            <h1 class="galeria-titulo">Galeria de eventos</h1>
          </div>

          <div class="galeria-grid">
            <div class="card-evento">
              <a href="Projetos/Projeto1.html">
                <div class="card-titulo">Hackathon 2026</div>
                <div class="card-img"><img src="Imagens/Projeto1.png" alt="Hackathon 2026"></div>
              </a>
            </div>
            <div class="card-evento">
              <a href="Projetos/Projeto2.html">
                <div class="card-titulo">Feira Verde</div>
                <div class="card-img"><img src="Imagens/Projeto2.png" alt="Feira Verde"></div>
              </a>
            </div>
            <div class="card-evento">
              <a href="Projetos/Projeto3.html">
                <div class="card-titulo">Workshop Pitch</div>
                <div class="card-img"><img src="Imagens/Projeto3.png" alt="Workshop Pitch"></div>
              </a>
            </div>

            <div class="card-evento">
              <a href="Projetos/Projeto4.html">
                <div class="card-titulo">Evento 4</div>
                <div class="card-img"><img src="Imagens/Projeto4.png" alt="Evento 4"></div>
              </a>
            </div>
            <div class="card-evento">
              <a href="Projetos/Projeto5.html">
                <div class="card-titulo">Evento 5</div>
                <div class="card-img"><img src="Imagens/Projeto5.png" alt="Evento 5"></div>
              </a>
            </div>
            <div class="card-evento">
              <a href="Projetos/Projeto6.html">
                <div class="card-titulo">Evento 6</div>
                <div class="card-img"><img src="Imagens/Projeto6.png" alt="Evento 6"></div>
              </a>
            </div>
          </div>
        </div>
      </main>

      <footer class="rodape">
        <a href="contato.html">Fale Conosco</a>
        <span>2026</span>
        <span>Redes Sociais</span>
      </footer>
    </div>
  </div>
</body>
</html>
