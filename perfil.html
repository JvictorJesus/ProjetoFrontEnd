<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub - Conta</title>
  <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>
  <div class="site">
    <aside class="menu-lateral">
      <div class="marca">
        <a href="index.html">EventHub</a>
        <span>Eventos e iniciativas</span>
      </div>
      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Galeria</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="perfil.html" class="ativo">Conta</a>
      </nav>
      <div class="menu-rodape">© 2026 EventHub</div>
    </aside>
    
    <div class="area-principal">
      <header class="topo">
        <a href="index.html" class="logo">Event<span>Hub</span></a>

        <!-- Barra de pesquisa no centro -->
        <div class="topo-pesquisa">
          <input type="text" placeholder="Pesquisar eventos ou projetos...">
        </div>

        <a href="publicar.html" class="btn-destaque">Publicar</a>
      </header>
      
      <main>
        <div class="perfil-area">
          <div class="perfil-box">
            <div class="perfil-topo">
              <div class="perfil-avatar">
                <img src="Imagens/avatar.png" alt="Avatar">
              </div>
              <div>
                <h2>Nome de Usuario</h2>
                <span>@Nome de Usuario</span>
              </div>
            </div>

            <div class="perfil-corpo">
              <div class="perfil-menu">
                <a href="#">Informações</a>
                <a href="#">Editar Dados</a>
                <a href="#">Configurações</a>
                <a href="login.html">Sair da Conta</a>
              </div>
              <div class="perfil-info">
                <label>Email Cadastrado</label>
                <div class="campo">EmailDaConta@gmail.com</div>
                <label>Publicações</label>
                <div class="campo">2</div>
                <label>Seguindo</label>
                <div class="campo">3</div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer class="rodape">
        <a href="contato.html">Fale Conosco</a>
        <span>2026</span>
        <span>Redes Sociais</span>
      </footer>
    </div>
  </div>
</body>
</html>
