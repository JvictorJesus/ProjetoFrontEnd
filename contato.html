<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub - Contato</title>
  <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>
  <div class="site">
    <aside class="menu-lateral">
      <div class="marca">
        <a href="index.html">EventHub</a>
        <span>Eventos e iniciativas</span>
      </div>
      <nav>
        <a href="index.html" >Início</a>
        <a href="projetos.html">Galeria</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html" class="ativo">Contato</a>
        <a href="perfil.html">Conta</a>
      </nav>
      <div class="menu-rodape">© 2026 EventHub</div>
    </aside>
    
    <div class="area-principal">
      <header class="topo">
        <a href="index.html" class="logo">Event<span>Hub</span></a>
        <a href="publicar.html" class="btn-destaque">Publicar</a>
      </header>
      
      <main>
        <div class="form-area">
          <div class="form-box">
            <h2>Fale conosco</h2>
            <form action="#" method="post">
              <input type="text" name="nome" placeholder="Nome" required>
              <input type="email" name="email" placeholder="E-mail" required>
              <input type="tel" name="telefone" placeholder="Telefone">
              <input type="text" name="assunto" placeholder="Assunto" required>
              <textarea name="mensagem" placeholder="Mensagem" required></textarea>
              <button type="submit">Enviar</button>
            </form>
          </div>
        </div>
      </main>

      <footer class="rodape">
        <a href="contato.html">Fale Conosco</a>
        <span>2026</span>
        <span>Redes Sociais</span>
      </footer>
    </div>
  </div>
</body>
</html>
