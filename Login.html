<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub - Entrar</title>
  <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>
  <div class="site">
    <aside class="menu-lateral">
      <div class="marca">
        <a href="Index.html">EventHub</a>
        <span>Eventos e iniciativas</span>
      </div>

      <nav>
        <a href="Index.html">Início</a>
        <a href="Projetos.html">Galeria</a>
        <a href="Sobre.html">Sobre</a>
        <a href="Contato.html">Contato</a>
        <a href="Perfil.html">Conta</a>
      </nav>
      <div class="menu-rodape">© 2026 EventHub</div>
    </aside>
    
    <div class="area-principal">
      <header class="topo">
        <a href="Index.html" class="logo">Event<span>Hub</span></a>
        <a href="Publicar.html" class="btn-destaque">Publicar</a>
      </header>

      <main>
        <div class="form-area">
          <div class="form-box">
            <h2>Entrar na Conta</h2>
            <form action="Perfil.html" method="get">
              <input type="email" name="email" placeholder="E-mail" required>
              <input type="password" name="senha" placeholder="Senha" required>
              <button type="submit">Entrar</button>
            </form>
            <p class="link-login">Não tem conta? <a href="Registro.html">Registrar</a></p>
          </div>
        </div>
      </main>
      
      <footer class="rodape">
        <a href="Contato.html">Fale Conosco</a>
        <span>2026</span>
        <span>Redes Sociais</span>
      </footer>
    </div>
  </div>
</body>
</html>
